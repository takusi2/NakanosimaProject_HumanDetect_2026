template_path: "../../../humanA/20260902_1552_2fparking_nowide_gC01_gS06_iir040_nrA_cloudy-none_d4p5m_camstatic_manA-framein-right_t01_motor - frame at 0m5s._3jpg.jpg"
input_source: video
video_path: "../../../output/tests/2026-0826-1601-05_center_surround.mp4"
camera_index: 0
# 入力をこの大きさにそろえてから検出する。未指定なら入力サイズをそのまま使う。
frame_width: 160
frame_height: 120
window_name: Coarse-to-fine mannequin matcher

device: cuda
frame_downscale: 0.5
coarse_template_scales: [0.3, 0.4, 0.5]
detail_template_scales: [1.0, 0.9, 0.8, 0.7, 0.6]
coarse_stride: 2
# 詳細探索のstrideは、各倍率sについて max(detail_stride_min, floor(detail_stride_base * s))。
# 例: base=4, min=2 のとき、1.0→4、0.9→3、0.8→3、0.7以下→2。
detail_stride_base: 4
detail_stride_min: 2
coarse_top_k: 3
coarse_candidates_per_template: 20
nms_distance_original_px: 40
roi_margin_px: 5
final_max_error: 25.0

# 同一位置の生検出を追跡し、直近10フレーム中5回以上でMATCHと確定する。
target_confirm_window_frames: 10
target_confirm_frames: 5
match_iou_thresh: 0.8
max_track_age: 30


brightness_weights:
  r: 0.299
  g: 0.587
  b: 0.114
channel_weights:
  rg: 0.5
  by: 0.5
  y: 1.0
variance_channel_weights:
  rg: 1.0
  by: 1.0
  y: 1.0
variance_log_distance_max: 5.0
variance_epsilon: 1.0
# 平坦領域の絶対分散下限。色分散(RG + BY)とBrightness分散が両方この値未満なら除外する。
# 現在の参照画像の各倍率における分散の約10%を初期値としている。
min_chroma_variance: 50.0
min_brightness_variance: 1000.0
min_weight: 0.05

# 保存制御。enabled: false にすると、画像・スコア・動画を一切保存しない。
# every_n_frames は「フレーム画像」と「スコア」の保存間隔。検証動画には影響しない。
save:
  enabled: false
  every_n_frames: 1
  detail_templates: true
  images:
    original_frame: true
    coarse_frame: true
    coarse_candidates: true
    coarse_rois: true
    variance_filters: true
    detail_matches: true
    best_match: true
  scores:
    csv: true
    json: true
  annotated_video: false
  performance_json: false

# 処理時間の計測設定。ウォームアップフレームは集計対象外にする。
performance:
  enabled: true
  warmup_frames: 10
  report_every_n_frames: 50
max_frames: null
show_window: true
# 表示ウィンドウだけの大きさ。検出処理や保存元フレームは160x120のまま。
display_width: 640
display_height: 480
results_root: "../results"
