# 粗探索・詳細探索マネキン検出の基本設定例。
# 新しい実験設定を作るときは、この構成をコピーしてパスと検出条件を変更する。

# =============================================================================
# 1. 入力設定
# =============================================================================
template_path: "../../../humanA/1-10-hiroto - frame at 0m0s.jpg"
input_source: video
video_path: "../../../output/9-2/20260902_1552_2fparking_nowide_gC01_gS06_iir040_nrA_cloudy-none_d4p5m_camstatic_manA-framein-right_t01_motor.mp4"
# input_source: camera のときだけ使うカメラ番号。
camera_index: 0
# 検出前に入力フレームをそろえるサイズ [幅, 高さ]。
input_width: 160
input_height: 120

# =============================================================================
# 2. 表示設定
# =============================================================================
show_window: true
window_name: Coarse-to-fine mannequin matcher
# 表示用サイズ [幅, 高さ]。検出・保存時のサイズは input_width / input_height。
display_width: 1280
display_height: 960

# =============================================================================
# 3. 出力・保存設定
# =============================================================================
results_root: "../results"
save:
  enabled: true
  every_n_frames: 1
  detail_templates: true
  images:
    original_frame: true
    coarse_frame: true
    coarse_candidates: true
    coarse_rois: true
    variance_filters: true
    detail_matches: true
    best_match: true
  scores:
    csv: true
    json: true
  annotated_video: true
  performance_json: true

performance:
  enabled: true
  warmup_frames: 10
  # 0なら終了時のみ、正の値ならそのフレーム間隔で計測値を端末表示する。
  report_every_n_frames: 0

# nullなら動画終端まで処理する。
processing_frame_limit: null

# =============================================================================
# 4. 検出パラメータ: 粗探索・詳細探索ROI
# =============================================================================
device: cuda
frame_downscale: 0.25
coarse_template_scales: [0.20]
detail_template_scales: [1.0, 0.8, 0.6, 0.4]
coarse_stride: 2
# 倍率sごとに max(detail_stride_min, floor(detail_stride_base × s)) を使う。
detail_stride_base: 4
detail_stride_min: 2
coarse_top_k: 3
coarse_candidates_per_template: 20
nms_distance_original_px: 120
roi_margin_px: 32
final_max_error: 27.0

# =============================================================================
# 5. 検出パラメータ: 色特徴量・分散フィルタ
# =============================================================================
brightness_weights:
  r: 0.299
  g: 0.587
  b: 0.114
channel_weights:
  rg: 0.5
  by: 0.5
  y: 2.0
# RG/BY/Brightnessの対数分散差に用いる重み。
variance_channel_weights:
  rg: 1.0
  by: 1.0
  y: 1.0
variance_log_distance_max: 3.0
variance_epsilon: 1.0
# 0.0なら平坦領域の絶対分散下限による除外を無効にする。
min_chroma_variance: 0.0
min_brightness_variance: 0.0
min_weight: 0.05

# =============================================================================
# 6. 検出パラメータ: 時系列追跡
# =============================================================================
target_confirm_window_frames: 10
target_confirm_frames: 5
match_iou_thresh: 0.8
max_track_age: 30
