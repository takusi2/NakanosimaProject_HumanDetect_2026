# ============================================================
# 入力ソース設定
# "udp"    : イメージセンサ（UDP受信）
# "camera" : 内蔵カメラ
# "video"  : 動画ファイル
# ============================================================
input_source: "video"
video_path: "./output/1-10-hiroto-masa.mp4"
camera_index: 0

# モデル設定
seg_model_pt: "yolo11s-seg.pt"
pred_thres: 0.5
frame_width: 160
frame_height: 120
fps: 5
window_name: "YOLOv11 + OSNET"

# セグメンテーション設定
fill_bground_color: [0, 0, 0]  # BGR順

# 描画色の設定 (BGR順)
person_color: [255, 0, 0]
maybe_target_color: [0, 165, 255]
confirmed_target_color: [0, 200, 0]
text_color: [255, 255, 255]

# 参照画像の設定
sample_img_dir: "./humanA"
sample_x_margin: 0   # 0.0~0.5の範囲で指定（左右それぞれの切り取り割合）
sample_y_top: 0     # 0.0~1.0の範囲で指定（上側の切り取り割合）
sample_y_bottom: 1  # 0.0~1.0の範囲で指定（下側の切り取り割合）

# OSNETの設定
reid_model: "osnet_x0_25"
sim_thresh: 0.6
target_confirm_frames: 5
target_confirm_window_frames: 8
match_mask_iou_thresh: 0.7

# セグメンテーション領域の最小サイズ
min_width: 15     #人物が横向きに写る際の幅に合わせて小さめに設定
min_height: 45
min_area: 900

# クロップ率（推論側）
# x_marginは0.0~0.5の範囲で指定（左右それぞれの切り取り割合）
crop_x_margin: 0.1
crop_y_top: 0.15
crop_y_bottom: 0.97     # 下半身が切れないよう大きめに設定

# デバッグ用設定
debug_dir: "./debug_out/config_seg"
debug_save_gallery_crops: true
debug_save_detect_crops: true  # MAYBE/MATCH時のみ保存
debug_print_detection_logs: false

# トラック保持フレーム数
max_track_age: 30

# モデル構造出力
print_model_info: false