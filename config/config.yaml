# ============================================================
# 入力ソース設定
# "udp"    : イメージセンサ（UDP受信）
# "camera" : 内蔵カメラ
# "video"  : 動画ファイル
# ============================================================
input_source: "video"
video_path: "./output/2026-0806-1637-40_bgr.mp4"
camera_index: 0

# モデル設定
model_pt: "yolo11s.pt"
pred_thres: 0.5
frame_width: 640
frame_height: 480
fps: 30
window_name: "YOLOv11 + OSNET"

# 描画色の設定 (BGR順)
person_color: [255, 0, 0]
maybe_target_color: [0, 165, 255]
confirmed_target_color: [0, 200, 0]
text_color: [255, 255, 255]

# 参照画像の設定
sample_img_dir: "./humanA"
sample_x_margin: 0.35   # 0.0~0.5の範囲で指定（左右それぞれの切り取り割合）
sample_y_top: 0.15     # 0.0~1.0の範囲で指定（上側の切り取り割合）
sample_y_bottom: 0.85  # 0.0~1.0の範囲で指定（下側の切り取り割合）

# OSNETの設定
reid_model: "osnet_x0_25"
sim_thresh: 0.60
target_confirm_frames: 5
match_iou_thresh: 0.8

# 検出ボックスの最小サイズ
min_box_w: 80
min_box_h: 160
min_box_area: 15000

# クロップ率（推論側）
# x_marginは0.0~0.5の範囲で指定（左右それぞれの切り取り割合）
crop_x_margin: 0.1
crop_y_top: 0.15
crop_y_bottom: 0.85

# デバッグ用設定
debug_dir: "./debug_out"
debug_save_gallery_crops: true
debug_save_detect_crops: false  # MAYBE/MATCH時のみ保存
debug_print_detection_logs: false

# トラック保持フレーム数
max_track_age: 30

# モデル構造出力
print_model_info: false