# ロボット用の粗探索・詳細照合マネキン検出設定。相対パスはこの設定ファイル基準。
# "udp" は inSightセンサのCenter-Surround画像を ClsImageViewerUDP で受信する。
# "camera" は Webカメラ、"video" は video_path の動画を使う。
input_source: video
video_path: ../output/tests/2026-0902-1547-10_center_surround.mp4
camera_index: 0
frame_width: 160
frame_height: 120
window_name: Coarse-to-fine mannequin detector
# 表示ウィンドウだけの大きさ。検出・追跡・center_xの座標系は160x120のまま。
display_width: 640
display_height: 480

template_path: ../humanA/20260902_1552_2fparking_nowide_gC01_gS06_iir040_nrA_cloudy-none_d4p5m_camstatic_manA-framein-right_t01_motor - frame at 0m5s._3jpg.jpg

device: cuda
frame_downscale: 0.5
coarse_template_scales: [0.3, 0.4, 0.5]
detail_template_scales: [1.0, 0.9, 0.8, 0.7, 0.6]
coarse_stride: 2
detail_stride_base: 4
detail_stride_min: 2
coarse_top_k: 3
coarse_candidates_per_template: 20
nms_distance_original_px: 40
roi_margin_px: 5
final_max_error: 27.0

# 同一位置の生検出を追跡し、直近10フレーム中5回以上でMATCHと確定する。
target_confirm_window_frames: 10
target_confirm_frames: 5
match_iou_thresh: 0.8
max_track_age: 30
maybe_target_color: [0, 165, 255]
confirmed_target_color: [0, 255, 0]
no_match_color: [0, 0, 255]

brightness_weights:
  r: 0.299
  g: 0.587
  b: 0.114
channel_weights:
  rg: 0.5
  by: 0.5
  y: 1.0
variance_channel_weights:
  rg: 1.0
  by: 1.0
  y: 1.0
variance_log_distance_max: 5.0
variance_epsilon: 1.0
min_chroma_variance: 50.0
min_brightness_variance: 1000.0
min_weight: 0.05
